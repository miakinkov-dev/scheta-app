<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<!-- WebView Telegram держит эту страницу в кэше и после выкладки продолжает
     грузить бандл прошлой версии. Сам бандл имеет хэш в имени, поэтому
     запрещаем кэшировать только саму оболочку. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<!-- maximum-scale и user-scalable обязательны: iOS сам приближает страницу
     при фокусе на поле со шрифтом меньше 16px, и вёрстка уезжает вбок.
     Поля в дизайне 14px, увеличивать их — ломать макет. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Карманная бухгалтерия</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>body{-webkit-font-smoothing:antialiased;background:#000;margin:0}a{color:#c8f751;text-decoration:none}a:hover{color:#dcff8a}input,textarea{font-family:inherit;font-size:16px!important}input::placeholder,textarea::placeholder{color:#8b8c92}@keyframes upIn{0%{opacity:.2;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{0%{opacity:.4;transform:scale(.96)}to{opacity:1;transform:scale(1)}}</style>
</head>
<body>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<div id="root"></div>

<script>
(function () {
  var fallback = "assets/app.js?b=1789686901074"
  function load(src) {
    var s = document.createElement('script')
    s.type = 'module'
    s.src = src
    s.onerror = function () {
      if (src !== fallback) load(fallback)
      else document.getElementById('root').textContent = 'Не удалось загрузить приложение. Проверьте связь и откройте заново.'
    }
    document.body.appendChild(s)
  }
  // Запрос версии мимо кэша: имя оболочки не меняется, а бандл меняется каждую выкладку.
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json() })
    .then(function (v) { load(v.main || fallback) })
    .catch(function () { load(fallback) })
})()
</script>
</body>
</html>
