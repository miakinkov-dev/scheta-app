# Supabase на бесплатном тарифе усыпляет проект после недели без обращений
# к API. Раз в трое суток делаем настоящий запрос к базе — этого хватает,
# чтобы проект считался активным, даже если приложением не пользовались.
#
# Запрос идёт с публикуемым ключом и читает пустую выборку: RLS без сессии
# ничего не отдаёт, и это ровно то, что нужно — нам важен сам факт обращения.
name: keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Обращение к Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/banks?select=id&limit=1")
          echo "Ответ REST: $code"
          # Падаем на любом не-200: молчаливый keepalive, который на самом
          # деле не работает, хуже его отсутствия — о нём не узнаешь.
          test "$code" = "200"
